name: HERETIC — from-scratch architecture CI

on:
  pull_request:
    paths:
      - "src/heretic_ronin/**"
      - "scripts/build_heretic_tokenizer.py"
      - "tests/test_heretic_from_scratch.py"
      - "requirements-heretic.txt"
      - ".github/workflows/heretic-from-scratch-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"
          python -m pip install "numpy>=1.26" "tokenizers>=0.20"
      - name: Run model and tokenizer tests
        run: python -m unittest tests.test_heretic_from_scratch -v
