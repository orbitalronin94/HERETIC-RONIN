name: HERETIC — audit full train corpus before 10k continuation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-heretic-training-corpus.yml"
      - "scripts/audit_heretic_training_corpus.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Recover and verify the exact RONIN-IA train-only bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p incoming
          curl --fail --location --retry 4 -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/orbitalronin94/HERETIC-RONIN/actions/artifacts/13536786501/zip" -o incoming/ronin-ia-train.zip
          echo "8a1e6be6a02b97b24681f2d34909cf4562213e84d0b9824f4ebca64a279e9cef  incoming/ronin-ia-train.zip" | sha256sum --check
      - name: Run global exact, near-duplicate and 120-question holdout audit
        run: python scripts/audit_heretic_training_corpus.py
      - name: Publish immutable audit report
        uses: actions/upload-artifact@v7
        with:
          name: heretic-global-corpus-audit-${{ github.run_id }}
          path: reports/corpus-audit/GLOBAL-CORPUS-AUDIT.json
          if-no-files-found: error
          retention-days: 90
