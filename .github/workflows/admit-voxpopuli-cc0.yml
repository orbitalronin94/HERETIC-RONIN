name: HERETIC — admit reviewed CC0 VoxPopuli transcripts
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  admit:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Recover pinned base and candidate artifacts
        run: |
          set -euo pipefail
          mkdir -p incoming
          curl --fail --location --retry 4 -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/orbitalronin94/HERETIC-RONIN/actions/artifacts/13536786501/zip" -o incoming/ronin-ia-train.zip
          echo "8a1e6be6a02b97b24681f2d34909cf4562213e84d0b9824f4ebca64a279e9cef  incoming/ronin-ia-train.zip" | sha256sum --check
          curl --fail --location --retry 4 -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/orbitalronin94/HERETIC-RONIN/actions/artifacts/13594451098/zip" -o incoming/candidates.zip
          echo "4580efd18cbc11ed2c94947236a3a814b32345fc540a5df6e1550bce01266018  incoming/candidates.zip" | sha256sum --check
      - name: Admit only pinned CC0 gold VoxPopuli train transcripts
        run: python scripts/admit_voxpopuli_cc0.py --base-zip incoming/ronin-ia-train.zip --candidate-zip incoming/candidates.zip
      - name: Upload admitted dataset and immutable manifest
        uses: actions/upload-artifact@v7
        with:
          name: heretic-admitted-voxpopuli-cc0-${{ github.run_id }}
          path: staging/admitted/voxpopuli-cc0/
          if-no-files-found: error
          compression-level: 1
          retention-days: 90
