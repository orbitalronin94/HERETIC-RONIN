name: Bootstrap Drosophila model and datasets

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/bootstrap.yml"

permissions:
  contents: read

concurrency:
  group: heretic-drosophila-bootstrap
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout HERETIC-RONIN
        uses: actions/checkout@v5

      - name: Fetch admitted datasets and model manifests from RONIN-IA
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/orbitalronin94/RONIN-IA.git source
          git -C source sparse-checkout set data/datasets/admitted weights
          mkdir -p staging/data/datasets staging/weights
          cp -a source/data/datasets/admitted staging/data/datasets/
          cp source/weights/ronin-drosophila-main.json staging/weights/
          cp source/weights/README.md staging/weights/RONIN-IA-weights-README.md

      - name: Download and verify the promoted 100.9M checkpoint
        shell: bash
        env:
          EXPECTED_SHA256: "f3f8e2e75e418f8630372c242378a28010db83148d169d85ad3e4f73114cda9a"
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://github.com/orbitalronin94/RONIN-IA/releases/download/heretic-drosophila-100900160-2026-11-06/ronin-drosophila-100900160.pt" \
            -o staging/weights/ronin-drosophila-100900160.pt
          ACTUAL_SHA256="$(sha256sum staging/weights/ronin-drosophila-100900160.pt | cut -d ' ' -f1)"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"
          printf '%s  %s\n' "$EXPECTED_SHA256" "ronin-drosophila-100900160.pt" > staging/weights/SHA256SUMS

      - name: Write bundle inventory
        shell: bash
        run: |
          set -euo pipefail
          cat > staging/README.txt <<'EOF'
          HERETIC-RONIN bootstrap payload
          Contents:
          - data/datasets/admitted/: admitted dataset payloads and source manifests from RONIN-IA.
          - weights/ronin-drosophila-100900160.pt: 100,900,160-parameter checkpoint.
          - weights/ronin-drosophila-main.json: source model manifest.
          - weights/SHA256SUMS: verified checkpoint digest.

          Source: RONIN-IA release heretic-drosophila-100900160-2026-11-06.
          Checkpoint SHA-256: f3f8e2e75e418f8630372c242378a28010db83148d169d85ad3e4f73114cda9a

          Evaluation limits: paired 64-question MMLU-Pro screening was 5/64 before and
          after; G-0 is FAIL; global near-duplicate and holdout-contamination checks
          remain pending. This source checkpoint used no tutor/distillation.
          Dataset-specific license and attribution files are retained.
          EOF
          echo "Dataset files: $(find staging/data/datasets/admitted -type f | wc -l)"
          du -sh staging/data/datasets/admitted staging/weights

      - name: Upload HERETIC bootstrap bundle
        uses: actions/upload-artifact@v5
        with:
          name: heretic-drosophila-100900160-and-admitted-datasets
          path: staging/
          if-no-files-found: error
          compression-level: 1
          retention-days: 90
