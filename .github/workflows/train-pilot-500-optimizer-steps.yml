name: HERETIC — 500M pilot (500 optimizer steps)

on:
  workflow_dispatch:
    inputs:
      start_micro_step:
        description: "Global micro-step checkpoint"
        required: true
        default: "6600"
      resume_run_id:
        description: "Run containing the previous checkpoint artifact"
        required: true
        default: "42338551408"
      audit_run_id:
        description: "Successful global corpus audit run"
        required: true
        default: "42362365327"

permissions:
  contents: read
  actions: write

concurrency:
  group: heretic-real-corpus-accum40
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      PYTHONUNBUFFERED: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Resolve continuation parameters
        id: params
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            start=2600
            resume=42288969968
            audit=42288107561
          else
            start="${{ inputs.start_micro_step }}"
            resume="${{ inputs.resume_run_id }}"
            audit="${{ inputs.audit_run_id }}"
          fi
          if (( start < 2600 || start >= 22600 || (start - 2600) % 2000 != 0 )); then
            echo "Invalid pilot checkpoint: $start" >&2
            exit 1
          fi
          echo "start_micro_step=$start" >> "$GITHUB_OUTPUT"
          echo "resume_run_id=$resume" >> "$GITHUB_OUTPUT"
          echo "audit_run_id=$audit" >> "$GITHUB_OUTPUT"
          if [[ "$start" == "2600" ]]; then
            echo "resume_accum=false" >> "$GITHUB_OUTPUT"
          else
            echo "resume_accum=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download and enforce the signed global corpus audit
        uses: actions/download-artifact@v8
        with:
          name: heretic-global-corpus-audit-${{ steps.params.outputs.audit_run_id }}
          run-id: ${{ steps.params.outputs.audit_run_id }}
          github-token: ${{ github.token }}
          path: audit

      - name: Verify training authorization and holdout isolation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("audit/GLOBAL-CORPUS-AUDIT.json").read_text())
          print(json.dumps({k:report.get(k) for k in (
              "documents_audited","source_counts","near_duplicate_pairs_found",
              "exact_holdout_question_matches","training_authorized"
          )}, indent=2))
          if report.get("training_authorized") is not True:
              raise SystemExit("Global corpus audit did not authorize training.")
          if report.get("exact_holdout_question_matches") != 0:
              raise SystemExit("Holdout contamination detected.")
          PY

      - name: Download exact train-only corpus and verify SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p incoming
          cp audit/GLOBAL-CORPUS-AUDIT.json incoming/GLOBAL-CORPUS-AUDIT.json
          curl --fail --location --retry 5 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/orbitalronin94/HERETIC-RONIN/actions/artifacts/13536786501/zip" \
            -o incoming/ronin-ia-train.zip
          echo "8a1e6be6a02b97b24681f2d34909cf4562213e84d0b9824f4ebca64a279e9cef  incoming/ronin-ia-train.zip" | sha256sum --check

      - name: Recover exact checkpoint and paired holdout
        shell: bash
        env:
          RESUME_RUN_ID: ${{ steps.params.outputs.resume_run_id }}
          START_STEP: ${{ steps.params.outputs.start_micro_step }}
          RESUME_ACCUM: ${{ steps.params.outputs.resume_accum }}
        run: |
          set -euo pipefail
          mkdir -p incoming/resume
          curl --fail --location --retry 5 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/orbitalronin94/HERETIC-RONIN/actions/runs/${RESUME_RUN_ID}/artifacts" \
            -o incoming/artifacts.json
          if [[ "${RESUME_ACCUM}" == "true" ]]; then
            artifact_name="heretic-500m-accum40-micro-${START_STEP}"
          else
            artifact_name="heretic-500m-real-corpus-step-${START_STEP}"
          fi
          export ARTIFACT_NAME="${artifact_name}"
          python - <<'PY'
          import json, os
          data=json.load(open("incoming/artifacts.json"))
          name=os.environ["ARTIFACT_NAME"]
          found=[a for a in data.get("artifacts",[]) if a["name"]==name and not a.get("expired")]
          if len(found)!=1:
              raise SystemExit(f"Expected one live artifact {name}; found {len(found)}")
          open("incoming/artifact-id","w").write(str(found[0]["id"]))
          PY
          aid="$(cat incoming/artifact-id)"
          curl --fail --location --retry 5 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/orbitalronin94/HERETIC-RONIN/actions/artifacts/${aid}/zip" \
            -o incoming/resume.zip
          unzip -q incoming/resume.zip -d incoming/resume
          checkpoint="$(find incoming/resume -name checkpoint.pt -print -quit)"
          test -n "${checkpoint}"
          cp "${checkpoint}" incoming/checkpoint.pt
          if [[ "${RESUME_ACCUM}" == "true" ]]; then
            baseline="$(find incoming/resume -name holdout-after.json -print -quit)"
            test -n "${baseline}"
            cp "${baseline}" incoming/holdout-before.json
          fi

      - name: Install CPU PyTorch and NumPy
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"
          python -m pip install "numpy>=1.26"

      - name: Checkout RONIN model implementation
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/orbitalronin94/RONIN-IA.git ronin-source
          git -C ronin-source sparse-checkout set ronin

      - name: Train one 2000-micro-step chunk (50 optimizer steps)
        id: train
        env:
          PYTHONPATH: ronin-source:scripts
          START_STEP: ${{ steps.params.outputs.start_micro_step }}
          RESUME_ACCUM: ${{ steps.params.outputs.resume_accum }}
        shell: bash
        run: |
          set -euo pipefail
          remaining=$((22600 - START_STEP))
          chunk=$(( remaining < 2000 ? remaining : 2000 ))
          if [[ "${RESUME_ACCUM}" == "true" ]]; then
            python scripts/heretic_train_accum40.py --start-micro-step "${START_STEP}" --micro-steps "${chunk}" --resume-accum
          else
            python scripts/heretic_train_accum40.py --start-micro-step "${START_STEP}" --micro-steps "${chunk}"
          fi
          end_step="$(python -c 'import json; print(json.load(open("out/progress.json"))["end_micro_step"])')"
          echo "end_step=${end_step}" >> "$GITHUB_OUTPUT"

      - name: Upload resumable checkpoint and paired holdout
        uses: actions/upload-artifact@v7
        with:
          name: heretic-500m-accum40-micro-${{ steps.train.outputs.end_step }}
          path: |
            out/checkpoint.pt
            out/progress.json
            out/holdout-before.json
            out/holdout-after.json
            out/chunk-report.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Chain next pilot chunk until exactly 500 optimizer steps
        if: steps.train.outputs.end_step != '22600'
        shell: bash
        env:
          NEXT_STEP: ${{ steps.train.outputs.end_step }}
          AUDIT_RUN_ID: ${{ steps.params.outputs.audit_run_id }}
        run: |
          set -euo pipefail
          curl --fail-with-body --retry 3 -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/orbitalronin94/HERETIC-RONIN/actions/workflows/train-pilot-500-optimizer-steps.yml/dispatches \
            -d "{\"ref\":\"main\",\"inputs\":{\"start_micro_step\":\"${NEXT_STEP}\",\"resume_run_id\":\"${GITHUB_RUN_ID}\",\"audit_run_id\":\"${AUDIT_RUN_ID}\"}}"

      - name: Retain final pilot checkpoint and evaluation
        if: steps.train.outputs.end_step == '22600'
        uses: actions/upload-artifact@v7
        with:
          name: heretic-500m-pilot-500-optimizer-steps-final
          path: |
            out/checkpoint.pt
            out/progress.json
            out/holdout-before.json
            out/holdout-after.json
            out/chunk-report.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 180
