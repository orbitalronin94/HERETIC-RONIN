name: HERETIC — 500M real-corpus continuation to step 250000

on:
  workflow_run:
    workflows: ["HERETIC — audit full train corpus before 10k continuation"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      start_step:
        description: "Global checkpoint step"
        required: true
        default: "600"
      resume_run_id:
        description: "Previous run containing the continuation checkpoint"
        required: false
        default: ""
      audit_run_id:
        description: "Successful real-corpus audit run ID"
        required: true
      allow_audit_override:
        description: "Explicitly continue despite failed global audit"
        required: true
        type: choice
        options: ["false", "true"]
        default: "false"

permissions:
  contents: read
  actions: write

concurrency:
  group: heretic-real-corpus-250k
  cancel-in-progress: false

jobs:
  train:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      PYTHONUNBUFFERED: "1"
      GH_TOKEN: \${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Resolve continuation parameters
        id: params
        shell: bash
        run: |
          set -euo pipefail
          if [[ "\${{ github.event_name }}" == "workflow_run" ]]; then
            echo "start_step=600" >> "$GITHUB_OUTPUT"
            echo "resume_run_id=" >> "$GITHUB_OUTPUT"
            echo "audit_run_id=\${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
            echo "override=false" >> "$GITHUB_OUTPUT"
          else
            echo "start_step=\${{ inputs.start_step }}" >> "$GITHUB_OUTPUT"
            echo "resume_run_id=\${{ inputs.resume_run_id }}" >> "$GITHUB_OUTPUT"
            echo "audit_run_id=\${{ inputs.audit_run_id }}" >> "$GITHUB_OUTPUT"
            echo "override=\${{ inputs.allow_audit_override }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download and enforce global real-corpus audit
        uses: actions/download-artifact@v4
        with:
          name: heretic-global-corpus-audit-\${{ steps.params.outputs.audit_run_id }}
          run-id: \${{ steps.params.outputs.audit_run_id }}
          github-token: \${{ github.token }}
          path: audit
      - name: Verify audit authorization
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          report=json.loads(Path("audit/GLOBAL-CORPUS-AUDIT.json").read_text())
          allowed=report.get("training_authorized") is True
          override=os.environ.get("AUDIT_OVERRIDE")=="true"
          print(json.dumps({k:report.get(k) for k in ("documents_audited","source_counts","exact_duplicate_groups_or_hits","near_duplicate_pairs_found","exact_holdout_question_matches","training_authorized")},indent=2))
          if not allowed and not override:
              raise SystemExit("Global audit did not authorize training; explicit override is required.")
          PY
        env:
          AUDIT_OVERRIDE: \${{ steps.params.outputs.override }}

      - name: Download exact RONIN-IA train-only artifact and verify SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p incoming
          curl --fail --location --retry 5 -H "Authorization: Bearer \${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/orbitalronin94/HERETIC-RONIN/actions/artifacts/13536786501/zip" \
            -o incoming/ronin-ia-train.zip
          echo "8a1e6be6a02b97b24681f2d34909cf4562213e84d0b9824f4ebca64a279e9cef  incoming/ronin-ia-train.zip" | sha256sum --check

      - name: Recover initial step-600 checkpoint or previous chunk checkpoint
        shell: bash
        env:
          RESUME_RUN_ID: \${{ steps.params.outputs.resume_run_id }}
          START_STEP: \${{ steps.params.outputs.start_step }}
        run: |
          set -euo pipefail
          mkdir -p incoming/checkpoint
          if [[ -z "\${RESUME_RUN_ID}" ]]; then
            curl --fail --location --retry 5 \
              -H "Authorization: Bearer \${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/orbitalronin94/HERETIC-RONIN/actions/artifacts/13534136061/zip" \
              -o incoming/initial-step-600.zip
            echo "f7586e15062577709406086dfc1fc2d856bd0fb20341d21f14001f9a8a909853  incoming/initial-step-600.zip" | sha256sum --check
            unzip -q incoming/initial-step-600.zip -d incoming/checkpoint
            found="$(find incoming/checkpoint -name 'student-500m-multidomain-distilled.pt' -print -quit)"
            test -n "\${found}"
            cp "\${found}" incoming/student-step-600.pt
          else
            mkdir -p incoming/resume
            curl --fail --location --retry 5 \
              -H "Authorization: Bearer \${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/orbitalronin94/HERETIC-RONIN/actions/runs/\${RESUME_RUN_ID}/artifacts" \
              -o incoming/resume-artifacts.json
            python - <<'PY'
            import json, os
            from pathlib import Path
            data=json.loads(Path("incoming/resume-artifacts.json").read_text())
            step=os.environ["START_STEP"]
            names=[a for a in data.get("artifacts",[]) if a["name"]==f"heretic-500m-real-corpus-step-{step}"]
            if len(names)!=1: raise SystemExit(f"Expected one resume artifact, found {len(names)}")
            Path("incoming/resume-artifact-id").write_text(str(names[0]["id"]))
            PY
            aid="$(cat incoming/resume-artifact-id)"
            curl --fail --location --retry 5 \
              -H "Authorization: Bearer \${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/orbitalronin94/HERETIC-RONIN/actions/artifacts/\${aid}/zip" \
              -o incoming/resume.zip
            unzip -q incoming/resume.zip -d incoming/resume
            test -s incoming/resume/checkpoint.pt
            test -s incoming/resume/holdout-before.json
            cp incoming/resume/checkpoint.pt incoming/checkpoint.pt
            cp incoming/resume/holdout-before.json incoming/holdout-before.json
          fi

      - name: Install CPU PyTorch and NumPy
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"
          python -m pip install "numpy>=1.26"

      - name: Checkout the RONIN model implementation
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/orbitalronin94/RONIN-IA.git ronin-source
          git -C ronin-source sparse-checkout set ronin

      - name: Train this 2000-step chunk on real train partitions only
        id: train
        env:
          PYTHONPATH: ronin-source
          START_STEP: \${{ steps.params.outputs.start_step }}
          RESUME_RUN_ID: \${{ steps.params.outputs.resume_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "\${RESUME_RUN_ID}" ]]; then
            steps_left=$((250000 - START_STEP))
            chunk=$(( steps_left < 2000 ? steps_left : 2000 ))
            python scripts/heretic_train_real_corpus_250k.py --start-step "\${START_STEP}" --steps "\${chunk}" --resume
          else
            python scripts/heretic_train_real_corpus_250k.py --start-step 600 --steps 2000
          fi
          end_step="$(python -c 'import json; print(json.load(open("out/progress.json"))["end_step"])')"
          echo "end_step=\${end_step}" >> "$GITHUB_OUTPUT"

      - name: Upload resumable checkpoint and exact holdout baseline
        uses: actions/upload-artifact@v4
        with:
          name: heretic-500m-real-corpus-step-\${{ steps.train.outputs.end_step }}
          path: |
            out/checkpoint.pt
            out/progress.json
            out/holdout-before.json
            out/holdout-after.json
            out/final-report.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

      - name: Chain the next 2000-step run until global step 250000
        if: steps.train.outputs.end_step != '250000'
        shell: bash
        env:
          NEXT_STEP: \${{ steps.train.outputs.end_step }}
          AUDIT_RUN_ID: \${{ steps.params.outputs.audit_run_id }}
        run: |
          set -euo pipefail
          curl --fail-with-body --retry 3 -X POST \
            -H "Authorization: Bearer \${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/orbitalronin94/HERETIC-RONIN/actions/workflows/train-real-corpus-250k.yml/dispatches \
            -d "{\"ref\":\"main\",\"inputs\":{\"start_step\":\"\${NEXT_STEP}\",\"resume_run_id\":\"\${GITHUB_RUN_ID}\",\"audit_run_id\":\"\${AUDIT_RUN_ID}\",\"allow_audit_override\":\"false\"}}"

      - name: Retain final checkpoint and paired 120-question report
        if: steps.train.outputs.end_step == '250000'
        uses: actions/upload-artifact@v4
        with:
          name: heretic-500m-real-corpus-final-step-250000
          path: |
            out/checkpoint.pt
            out/progress.json
            out/holdout-before.json
            out/holdout-after.json
            out/final-report.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
