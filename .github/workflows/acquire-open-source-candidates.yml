name: HERETIC — acquire pinned open-source corpus candidates

on:
  schedule:
    - cron: "30 0,6,12,18 * * *"
  # Avoid full acquisition runs from review branches; PRs run validation only.
  push:
    branches: [main]
    paths:
      - ".github/workflows/acquire-open-source-candidates.yml"
  workflow_dispatch:
    inputs:
      source_group:
        description: "Deterministic acquisition tranche (0–3)"
        required: true
        default: "0"
        type: choice
        options:
          - "0"
          - "1"
          - "2"
          - "3"
  pull_request:
    paths:
      - ".github/workflows/acquire-open-source-candidates.yml"
      - "scripts/acquire_open_source_candidates.py"
      - "scripts/license_gates.py"
      - "scripts/acquisition_safety.py"
      - "scripts/review_candidate_samples.py"
      - "tests/test_review_candidate_samples.py"
      - "tests/test_license_gates.py"
      - "tests/test_acquisition_safety.py"

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Compile acquisition and license gate without downloading datasets
        run: python -m py_compile scripts/acquire_open_source_candidates.py scripts/review_candidate_samples.py scripts/license_gates.py scripts/acquisition_safety.py
      - name: Test license and acquisition safety gates
        run: python -m unittest discover -s tests -v

  acquire:
    if: github.event_name != 'pull_request'
    concurrency:
      group: heretic-open-source-acquisition
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: "1"
      HERETIC_SOURCE_GROUP_COUNT: "4"
      HERETIC_SOURCE_GROUP_INPUT: ${{ inputs.source_group || '0' }}
    steps:
      - name: Checkout HERETIC-RONIN
        uses: actions/checkout@v5

      - name: Select deterministic daily source tranche
        id: source-group
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" || "${GITHUB_EVENT_NAME}" == "push" ]]; then
            day_of_year="$(date -u +%j)"
            hour_utc="$(date -u +%H)"
            tranche_slot="$((10#$hour_utc / 6))"
            group="$(((10#$day_of_year + tranche_slot) % 4))"
          else
            group="${HERETIC_SOURCE_GROUP_INPUT:-0}"
          fi
          if ! [[ "$group" =~ ^[0-3]$ ]]; then
            echo "Invalid source group: $group" >&2
            exit 2
          fi
          echo "HERETIC_SOURCE_GROUP=$group" >> "$GITHUB_ENV"
          echo "group=$group" >> "$GITHUB_OUTPUT"
          echo "Acquisition source group: $group/4"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dataset streaming tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "datasets==4.3.0" "huggingface_hub==0.36.0" "pyarrow>=20"

      - name: Stream bounded train-only slices and pin source revisions
        run: python scripts/acquire_open_source_candidates.py

      - name: Compile and prepare local candidate samples without logging excerpts
        run: |
          python -m py_compile scripts/acquire_open_source_candidates.py scripts/review_candidate_samples.py
          python scripts/review_candidate_samples.py

      - name: Upload private candidate tranche and sample report
        id: upload-private-candidates
        if: always() && github.event.repository.private == true
        uses: actions/upload-artifact@v7
        with:
          name: heretic-open-source-candidates-${{ github.run_id }}-group-${{ steps.source-group.outputs.group }}
          path: |
            staging/open-source-candidates/
            !staging/open-source-candidates/*.partial
            !staging/open-source-candidates/**/*.partial
          if-no-files-found: ignore
          compression-level: 1
          retention-days: 90

      - name: Upload public manifest only (no payloads or sample text)
        id: upload-public-manifest
        if: always() && github.event.repository.private != true
        uses: actions/upload-artifact@v7
        with:
          name: heretic-open-source-manifest-${{ github.run_id }}-group-${{ steps.source-group.outputs.group }}
          path: staging/open-source-candidates/OPEN-SOURCE-MANIFEST.json
          if-no-files-found: ignore
          compression-level: 1
          retention-days: 90

      - name: Report candidate scale; shortfall is informational
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=Path("staging/open-source-candidates/OPEN-SOURCE-MANIFEST.json")
          if not manifest.is_file():
              print("No complete candidate manifest was produced; no candidate bytes are counted.")
              raise SystemExit(0)
          report=json.loads(manifest.read_text())
          total=int(report.get("total_bytes",0))
          target=int(report.get("target_bytes",6800000000))
          print(json.dumps({"candidate_bytes":total,"target_bytes":target,"scale_factor":report.get("scale_factor_vs_current_effective_corpus"),"target_met":total>=target,"source_failures":report.get("source_failures",[])},indent=2))
          if total < target:
              print("Candidate scale target not met; this is not an admission and does not fail the acquisition run.")
          PY
