name: HERETIC — acquire pinned open-source corpus candidates

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/acquire-open-source-candidates.yml"
      - "scripts/acquire_open_source_candidates.py"
      - "data/scoped-library-catalog-100.json"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/acquire-open-source-candidates.yml"
      - "scripts/acquire_open_source_candidates.py"
      - "data/scoped-library-catalog-100.json"

permissions:
  contents: read

concurrency:
  group: heretic-open-source-acquisition-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Validate source catalog and compile acquisition script without downloading datasets
        run: |
          python -m py_compile scripts/acquire_open_source_candidates.py
          python -c 'import json; p=json.load(open("data/scoped-library-catalog-100.json", encoding="utf-8")); ids=[x["id"] for x in p["libraries"]]; assert p["requested_libraries"] == 100 and len(ids) == 100 and len(set(ids)) == 100; assert all(x.get("scope_approved") and x.get("discover_text_column") for x in p["libraries"]); print(f"validated {len(ids)} unique scoped libraries")'

  acquire:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout HERETIC-RONIN
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dataset streaming tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "datasets==4.3.0" "huggingface_hub==0.36.0" "pyarrow>=20"

      - name: Stream bounded train-only slices and pin source revisions
        run: python scripts/acquire_open_source_candidates.py

      - name: Upload candidate corpus and provenance manifest
        id: upload-candidates
        uses: actions/upload-artifact@v7
        with:
          name: heretic-open-source-candidates-${{ github.run_id }}
          path: staging/open-source-candidates/
          if-no-files-found: error
          compression-level: 1
          retention-days: 90

      - name: Enforce minimum 10x candidate corpus payload after preserving artifact
        if: always() && steps.upload-candidates.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("staging/open-source-candidates/OPEN-SOURCE-MANIFEST.json").read_text())
          total=int(report.get("total_bytes",0))
          target=int(report.get("target_bytes",6800000000))
          print(json.dumps({"candidate_bytes":total,"target_bytes":target,"scale_factor":report.get("scale_factor_vs_current_effective_corpus"),"target_met":total>=target,"source_failures":report.get("source_failures",[])},indent=2))
          if total < target:
              raise SystemExit(f"10x corpus acquisition floor not met: {total} < {target}; artifact was uploaded for inspection/retry.")
          PY
