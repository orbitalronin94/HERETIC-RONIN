name: HERETIC — acquire pinned open-source corpus candidates

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/acquire-open-source-candidates.yml"
      - "scripts/acquire_open_source_candidates.py"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/acquire-open-source-candidates.yml"
      - "scripts/acquire_open_source_candidates.py"

permissions:
  contents: read

concurrency:
  group: heretic-open-source-acquisition
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Compile acquisition script without downloading datasets
        run: python -m py_compile scripts/acquire_open_source_candidates.py scripts/review_candidate_samples.py

  acquire:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout HERETIC-RONIN
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dataset streaming tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "datasets==4.3.0" "huggingface_hub==0.36.0" "pyarrow>=20"

      - name: Stream bounded train-only slices and pin source revisions
        run: python scripts/acquire_open_source_candidates.py

      - name: Compile and manually sample candidate rows for human review
        run: |
          python -m py_compile scripts/acquire_open_source_candidates.py scripts/review_candidate_samples.py
          python scripts/review_candidate_samples.py

      - name: Upload PubMed CC-BY/CC0-filtered candidate shard
        uses: actions/upload-artifact@v7
        with:
          name: heretic-candidate-pubmed-${{ github.run_id }}
          path: |
            staging/open-source-candidates/common-pile__pubmed_filtered__default__train.jsonl
            staging/open-source-candidates/OPEN-SOURCE-MANIFEST.json
          if-no-files-found: ignore
          compression-level: 1
          retention-days: 90

      - name: Upload OpenThoughts3 candidate shard
        uses: actions/upload-artifact@v7
        with:
          name: heretic-candidate-openthoughts3-${{ github.run_id }}
          path: |
            staging/open-source-candidates/open-thoughts__OpenThoughts3-1.2M__default__train.jsonl
            staging/open-source-candidates/OPEN-SOURCE-MANIFEST.json
          if-no-files-found: ignore
          compression-level: 1
          retention-days: 90

      - name: Upload OpenR1 Math candidate shard
        uses: actions/upload-artifact@v7
        with:
          name: heretic-candidate-openr1-math-${{ github.run_id }}
          path: |
            staging/open-source-candidates/open-r1__OpenR1-Math-220k__default__train.jsonl
            staging/open-source-candidates/OPEN-SOURCE-MANIFEST.json
          if-no-files-found: ignore
          compression-level: 1
          retention-days: 90

      - name: Upload IFM reasoning candidate shards
        uses: actions/upload-artifact@v7
        with:
          name: heretic-candidate-ifm-reasoning-${{ github.run_id }}
          path: |
            staging/open-source-candidates/IFM__Code-Reasoning__code-no-thinking__train.jsonl
            staging/open-source-candidates/IFM__Math-Reasoning__math-dialogue__train.jsonl
            staging/open-source-candidates/OPEN-SOURCE-MANIFEST.json
          if-no-files-found: ignore
          compression-level: 1
          retention-days: 90

      - name: Upload deterministic manual review samples
        uses: actions/upload-artifact@v7
        with:
          name: heretic-candidate-manual-samples-${{ github.run_id }}
          path: staging/open-source-candidates/MANUAL-SAMPLE-REVIEW.json
          if-no-files-found: error
          compression-level: 1
          retention-days: 90

      - name: Upload candidate corpus and provenance manifest
        id: upload-candidates
        uses: actions/upload-artifact@v7
        with:
          name: heretic-open-source-candidates-${{ github.run_id }}
          path: staging/open-source-candidates/
          if-no-files-found: error
          compression-level: 1
          retention-days: 90

      - name: Enforce minimum 10x candidate corpus payload after preserving artifact
        if: always() && steps.upload-candidates.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("staging/open-source-candidates/OPEN-SOURCE-MANIFEST.json").read_text())
          total=int(report.get("total_bytes",0))
          target=int(report.get("target_bytes",6800000000))
          print(json.dumps({"candidate_bytes":total,"target_bytes":target,"scale_factor":report.get("scale_factor_vs_current_effective_corpus"),"target_met":total>=target,"source_failures":report.get("source_failures",[])},indent=2))
          if total < target:
              raise SystemExit(f"10x corpus acquisition floor not met: {total} < {target}; artifact was uploaded for inspection/retry.")
          PY
