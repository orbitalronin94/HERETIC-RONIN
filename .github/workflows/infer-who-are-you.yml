name: HERETIC — pregunta real «¿Quién eres?»

on:
  push:
    branches: [main]
    paths: [".github/workflows/infer-who-are-you.yml"]

permissions:
  contents: read
  actions: read

jobs:
  infer:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Download exact verified 500M step-600 checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p weights
          curl --fail --location --retry 5 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/orbitalronin94/HERETIC-RONIN/actions/artifacts/13534136061/zip" \
            -o weights/step-600.zip
          echo "f7586e15062577709406086dfc1fc2d856bd0fb20341d21f14001f9a8a909853  weights/step-600.zip" | sha256sum --check
          unzip -q weights/step-600.zip -d weights/extracted
          test -s weights/extracted/student-500m-multidomain-distilled.pt
      - name: Checkout exact model implementation
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/orbitalronin94/RONIN-IA.git ronin-source
          git -C ronin-source sparse-checkout set ronin
      - name: Install CPU inference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"
          python -m pip install "numpy>=1.26"
      - name: Ask the real checkpoint
        env:
          PYTHONPATH: ronin-source
        run: |
          python - <<'PY'
          import json, torch
          from pathlib import Path
          from ronin.config import ModelConfig
          from ronin.models.transformer import RoninLM
          from ronin.tokenizer.byte import ByteTokenizer

          torch.set_num_threads(4)
          ckpt_path = Path("weights/extracted/student-500m-multidomain-distilled.pt")
          ckpt = torch.load(ckpt_path, map_location="cpu", weights_only=False)
          cfg = ModelConfig(**ckpt["model_config"])
          model = RoninLM(cfg)
          model.load_state_dict(ckpt["model"], strict=True)
          model.eval()
          tokenizer = ByteTokenizer()

          prompt = "¿Quién eres?"
          ids = tokenizer.encode(prompt)
          generated = []
          with torch.inference_mode():
              for _ in range(240):
                  context = (ids + generated)[-cfg.context_length:]
                  x = torch.tensor([context], dtype=torch.long)
                  logits = model.forward_last_logits(
                      x, torch.tensor([len(context)-1], dtype=torch.long)
                  )
                  nxt = int(torch.argmax(logits[0]).item())
                  generated.append(nxt)
                  if nxt in (10, 13) and len(generated) > 24:
                      break
          completion = tokenizer.decode(generated)
          result = {
              "checkpoint_step": ckpt.get("step"),
              "parameter_count": sum(p.numel() for p in model.parameters()),
              "prompt": prompt,
              "completion": completion,
              "text": prompt + completion,
              "generation": "greedy",
              "note": "Literal raw continuation from verified checkpoint; not instruction-tuned."
          }
          print("CHECKPOINT_STEP:", result["checkpoint_step"])
          print("PARAMETERS:", result["parameter_count"])
          print("PROMPT:", prompt)
          print("COMPLETION:", repr(completion))
          print("TEXT:", result["text"])
          Path("inference-result.json").write_text(json.dumps(result, ensure_ascii=False, indent=2) + "\\n")
          PY
      - name: Upload literal model output
        uses: actions/upload-artifact@v7
        with:
          name: heretic-who-are-you-real-inference
          path: inference-result.json
          if-no-files-found: error
          retention-days: 30
